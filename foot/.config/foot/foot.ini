[main]
font=ComicShannsMono Nerd Font:style=Bold:size=14
[cursor]
style=block
blink=yes
beam-thickness=1.5
underline-thickness=2

[url]
launch=xdg-open ${url}
label-letters=sadfjklewcmpgh
osc8-underline=always

[colors-dark]
foreground=d1d4d2
background=16181a

regular0=16181a  # black (глубокий темный)
regular1=d87272  # red
regular2=c2ca73  # green
regular3=f9d17f  # yellow
regular4=8daecb  # blue
regular5=be9fc8  # magenta
regular6=96ccc5  # cyan
regular7=d1d4d2  # white

bright0=727272   # bright black
bright1=e2585e   # bright red
bright2=c5d754   # bright green
bright3=f3d151   # bright yellow
bright4=86b2e9   # bright blue
bright5=d0a2e5   # bright magenta
bright6=79cdc1   # bright cyan
bright7=f5f5f5   # bright white

